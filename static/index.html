<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Docs — RAG Chatbot Demo</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --accent:#7a1f2b; --line:#e4e4e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --card:#1e1e21; --ink:#ececee; --muted:#9a9aa0; --accent:#e0707e; --line:#2e2e33; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:32px 20px 120px; }
  h1 { font-size:1.5rem; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 24px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:12px 0; white-space:pre-wrap; }
  .me { border-color:var(--accent); }
  .meta { font-size:.8rem; color:var(--muted); margin-top:10px; }
  details { margin-top:8px; font-size:.85rem; } summary { cursor:pointer; color:var(--accent); }
  .src { border-left:3px solid var(--line); padding-left:10px; margin:8px 0; color:var(--muted); }
  form { position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--line); padding:14px; }
  .row { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .chips button { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:6px 12px; margin:0 6px 6px 0; font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Ask the Docs</h1>
  <p class="sub">A chatbot that answers only from your own documents and shows where each answer came from.</p>
  <div class="chips" id="chips"></div>
  <div id="log" aria-live="polite"></div>
</main>
<form id="f">
  <div class="row">
    <input id="q" placeholder="Ask a question about the documents…" autocomplete="off" required minlength="2" maxlength="500" aria-label="Question">
    <button id="b">Ask</button>
  </div>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), b = document.getElementById('b');
const examples = ['What are your opening hours?', 'How do refunds work?', 'Do you deliver to Northern Ireland?'];
examples.forEach(t => { const c = document.createElement('button'); c.type='button'; c.textContent=t; c.onclick=()=>{q.value=t; ask();}; document.getElementById('chips').append(c); });

function add(text, cls) { const d = document.createElement('div'); d.className = 'msg ' + (cls||''); d.textContent = text; log.append(d); d.scrollIntoView({behavior:'smooth'}); return d; }

async function ask() {
  const text = q.value.trim(); if (!text) return;
  add(text, 'me'); q.value=''; b.disabled = true;
  const pending = add('Thinking…');
  try {
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:text})});
    if (!r.ok) throw new Error('Request failed (' + r.status + ')');
    const data = await r.json();
    pending.textContent = data.answer;
    const meta = document.createElement('div'); meta.className='meta';
    meta.textContent = data.mode === 'llm' ? 'Answered by the language model' : data.mode === 'extractive' ? 'Model offline — showing the best matching section' : 'No matching documents';
    pending.append(meta);
    if (data.sources.length) {
      const det = document.createElement('details'); det.innerHTML = '<summary>Sources (' + data.sources.length + ')</summary>';
      data.sources.forEach(s => { const p = document.createElement('div'); p.className='src'; p.textContent = `[${s.n}] ${s.source} — ${s.heading}: ${s.excerpt}…`; det.append(p); });
      pending.append(det);
    }
  } catch (e) { pending.textContent = 'Sorry, that didn’t work. ' + e.message; }
  finally { b.disabled = false; q.focus(); }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); ask(); };
</script>
</body>
</html>
